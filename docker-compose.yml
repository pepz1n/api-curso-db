services:
  db:
    build: .
    container_name: api-curso-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ../api-curso
    container_name: api-curso
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SSL: "false"
      TOKEN_KEY: ${TOKEN_KEY}
      API_PORT: 3000
    ports:
      - "127.0.0.1:${API_PORT_HOST:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  front:
    build: ../api-curso-front
    container_name: api-curso-front
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # Só acessível de dentro do servidor: o público entra pelo Nginx
    ports:
      - "127.0.0.1:${FRONT_PORT_HOST:-3001}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    build: ./nginx
    container_name: api-curso-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      front:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  db-data:
