# Proxy reverso na porta 80:
#   /api/*  -> API (container "api", porta 3000), sem o prefixo /api
#   /*      -> front Next.js (container "front", porta 3000)
upstream api {
    server api:3000;
}

upstream front {
    server front:3000;
}

server {
    listen 80;
    server_name _;

    # Não mostra a versão do Nginx nas respostas
    server_tokens off;

    # Mesmo limite de body da API (express.json limit 50mb)
    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;

    # A barra no fim do proxy_pass remove o /api: /api/tasks/1 chega na API como /tasks/1
    location /api/ {
        proxy_pass http://api/;
    }

    location = /api {
        return 301 /api/;
    }

    location / {
        proxy_pass http://front;
    }
}
